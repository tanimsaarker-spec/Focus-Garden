plugins { id 'com.android.application' }

def siteUrl = file('../site-url.txt').text.trim()
def siteHost = new URI(siteUrl).host

android {
    namespace 'com.focusgarden.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.focusgarden.app'
        minSdk 21
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0'
        manifestPlaceholders = [hostName: siteHost, defaultUrl: siteUrl]
    }
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'focusgarden'
            keyAlias 'focusgarden'
            keyPassword 'focusgarden'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
